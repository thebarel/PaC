[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "process-as-code"
version = "0.1.0"
description = "A durable deterministic workflow runtime for Codex agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "PaC contributors" }]
dependencies = [
    "openai-codex>=0.147.0,<0.148",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
